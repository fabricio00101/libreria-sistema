{% extends 'biblioteca/base.html' %}

{% block title %}{% if miembro %}Editar{% else %}Nuevo{% endif %} Miembro - LibSistema{% endblock %}

{% block content %}
<div class="card-section" style="max-width: 600px; margin: 0 auto;">
    <div class="section-header">
        <h1 class="section-title">{% if miembro %}Editar{% else %}Registrar Nuevo{% endif %} Miembro</h1>
    </div>
    
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="nombre_completo">Nombre Completo</label>
            <input type="text" id="nombre_completo" name="nombre_completo" class="form-control" placeholder="Ej. Juan Pérez" value="{{ miembro.nombre_completo }}{{ nombre_completo }}" required>
        </div>
        <div class="form-group">
            <label for="email">Correo Electrónico (para notificaciones)</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Ej. juan.perez@example.com" value="{{ miembro.email }}{{ email }}" required>
        </div>
        <div class="form-group">
            <label for="telefono">Teléfono de Contacto</label>
            <input type="text" id="telefono" name="telefono" class="form-control" placeholder="Ej. +54 9 11 2233-4455" value="{{ miembro.telefono }}{{ telefono }}">
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Guardar Miembro</button>
            <a href="{% url 'miembro_list' %}" class="btn btn-secondary" style="flex: 1; text-align: center;">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
